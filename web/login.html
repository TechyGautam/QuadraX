<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuadraX - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(228, 63, 90, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(31, 64, 104, 0.3) 0px, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 36px 32px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-area span {
            color: #e43f5a;
        }

        h2 {
            color: #f8fafc;
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        p {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 15px;
            color: #f8fafc;
            transition: all 0.2s ease;
        }

        .input-group input::placeholder {
            color: #64748b;
        }

        .input-group input:focus {
            outline: none;
            border-color: #e43f5a;
            box-shadow: 0 0 0 3px rgba(228, 63, 90, 0.15);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #e43f5a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(228, 63, 90, 0.3);
            margin-top: 8px;
        }

        .btn:hover {
            background: #c72c41;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(228, 63, 90, 0.4);
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #94a3b8;
        }

        .register-link a {
            color: #e43f5a;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .register-link a:hover {
            color: #ff4d6d;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-area">
        <h2>Quadra<span>X</span></h2>
    </div>
    <h2>Welcome Back</h2>
    <p>Please enter your credentials to login 👋</p>

    <form method="post" action="/LoginUserRequest">
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" name="email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Enter your password" name="password" required>
        </div>

        <button class="btn" type="submit">Login</button>

        <div class="register-link">
            Don't have an account? 
            <a href="/RegisterPage">Register</a>
        </div>
    </form>
</div>

</body>
</html>
